config_version = 15

[bar.default]
background_opacity = 1.0
capsule = true
capsule_thickness = 0.89999998360872269
end = [
    "cpu",
    "temp",
    "ram",
    "volume",
    "bluetooth",
    "notifications",
    "clipboard",
    "keyboard_layout",
    "battery",
    "taskbar",
    "tray",
    "control-center"
]
font_family = "JetBrainsMono Nerd Font Mono"
margin_edge = 4
margin_ends = 4
position = "top"
radius = 12
start = [ "workspaces", "active_window", "audio_visualizer" ]
thickness = 25
widget_spacing = 2

[control_center]
width = 630

[location]
address = "Perm"
auto_locate = false

[notification]
background_opacity = 0.99999997764825821
offset_y = 3

[shell]
corner_radius_scale = 2.0
font_family = "JetBrainsMono Nerd Font Mono"
lang = "ru"

    [shell.animation]
    enabled = false

    [shell.launcher]
    compact = true
    default_view = "all"
    search_position = "top"
    width = 560

    [shell.panel]
    clipboard_placement = "attached"
    floating_layer = "top"
    launcher_placement = "attached"
    launcher_position = "auto"
    polkit_placement = "attached"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Solarized"
mode = "dark"
shell_mode = "follow"
source = "wallpaper"
sync_color_scheme = true
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    community_ids = [ "opencode", "pywalfox", "discord", "telegram", "neovim", "vscode", "steam", "tmux", "yazi" ]

[wallpaper.default]
path = "/home/robert/.config/wallpapers/wet-road-between-tall-trees-backiee-8K.jpg"

[wallpaper.last]
path = "/home/robert/.config/wallpapers/wet-road-between-tall-trees-backiee-8K.jpg"

[wallpaper.monitors.DP-3]
path = "/home/robert/.config/wallpapers/wet-road-between-tall-trees-backiee-8K.jpg"

[widget.active_window]
max_length = 165
title_scroll = "always"

[widget.audio_visualizer]
width = 165

[widget.clock]
format = "{:%H:%M %a %d %b}"

[widget.control-center]
glyph = "topology-star-3"

[widget.keyboard_layout]
show_glyph = false

[widget.taskbar]
only_active_workspace = true

[widget.workspaces]
active_pill_size = 1.0