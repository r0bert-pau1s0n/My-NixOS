[location]
address = "Perm"
auto_locate = false

[notification]
background_opacity = 0.99999997764825821
offset_y = 3

[plugins]
enabled = [ "h465855hgg/lyrics" ]

[shell]
corner_radius_scale = 2.0
font_family = "JetBrainsMono Nerd Font Mono"
lang = "ru"

    [shell.animation]
    enabled = false

    [shell.launcher]
    compact = true
    default_view = "all"
    search_position = "top"
    width = 560

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"
    floating_layer = "top"
    polkit_placement = "attached"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Solarized"
mode = "dark"
shell_mode = "follow"
source = "wallpaper"
sync_color_scheme = true
wallpaper_scheme = "vibrant"

    [theme.templates]
    community_ids = [ "opencode", "pywalfox", "discord", "telegram", "neovim", "vscode", "steam", "tmux", "yazi" ]

[wallpaper.default]
path = "/home/robert/.config/wallpapers/cigarette-smoke-universe-backiee-HD.jpg"

[wallpaper.last]
path = "/home/robert/.config/wallpapers/cigarette-smoke-universe-backiee-HD.jpg"

[wallpaper.monitors.DP-3]
path = "/home/robert/.config/wallpapers/cigarette-smoke-universe-backiee-HD.jpg"

[widget.active_window]
max_length = 165
title_scroll = "always"

[widget.audio_visualizer]
width = 165

[widget.clock]
format = "{:%H:%M %a %d %b}"

[widget.control-center]
glyph = "topology-star-3"

[widget.keyboard_layout]
show_glyph = false

[widget.taskbar]
only_active_workspace = true

[widget.workspaces]
active_pill_size = 1.0